schema_version = 2

# Xiaomi Redmi K40S / POCO F4 (munch, 22021211RC), Qualcomm SM8250-AC (Snapdragon 870).
#
# Target OS: iOS 16.7.16 (20H392), iPhone X (iPhone10,3 / D22AP) personality.
# iOS 16 is the last arm64 iOS generation; SM8250 has no ARMv8.3 PAC, so the
# arm64e iOS/iPadOS 27 profiles cannot run on this SoC.
#
# UEFI: edk2-msm (Platform/Xiaomi/sm8250/munch.dsc), NOT Mu-Silicium.
# The payload is a real FAT32 ESP volume on UFS; UniXNU.efi discovers it through
# EFI_SIMPLE_FILE_SYSTEM_PROTOCOL. No Mu-Silicium initrd HOB / RamDiskDxe is used.

[board]
name = "munch"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ios-16.7.16-20H392"
description = "Xiaomi Redmi K40S / POCO F4 (munch, 22021211RC), iOS 16.7.16 iPhone X personality, edk2-msm UEFI, ESP payload"
kit = "munch"

[components]
# Board drivers are the munch-specific ones from the SM8250 port. Drivers whose
# iOS 16 ABI differs from iPadOS 17 must be rebuilt from the iOS 16 kernel
# headers; see docs/PORTING-NOTES.md.
include = [
  "ArmDTPlatform",
  "ArmCpu",
  "SoftwareAES",
  "ShengUfs",
  "VirtioMmioBlock",
  "RamBlock",
  "GopFramebuffer",
  "XnuPrelink",
  "DarwinBoot",
  "AppleKeyStoreState",
  "ShengHidInput",
]

[userdata]
# Android userdata on UFS LUN 0, from the phone's GPT (same geometry as the
# existing munch iPadOS 17 port). Verify with: adb shell sgdisk -p /dev/block/sda
first_lba = 0x2a8000
last_lba = 0x3b037fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[kernel]
defconfig = "munch_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ios.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "os:patches/xnu/series", "device:patches/xnu/series"]
# The iOS 16 kernel is built from xnu-8796.141.3 with the ios-sweet patch set
# (see docs/PORTING-NOTES.md). These archives follow the munch component layout.
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "component:ShengUfs",
  "build-storage-bindings.py --component NativeUfs --archive libShengUfs.a --directory build/sheng-ufs",
  "component:VirtioMmioBlock",
  "build-storage-bindings.py --component NativeVirtioBlock --archive libVirtioMmioBlock.a --directory build/virtio-mmio-block --subset",
  "component:RamBlock",
  "build-storage-bindings.py --component NativeRamBlock --archive libRamBlock.a --directory build/ram-block --subset",
  "build-mockfs-fixture.py",
  "build-platform-power.py",
  "build-boot-progress.py",
  "build-link-stubs.py",
  "build-libpthread-kernel.py",
  "component:AppleKeyStoreState",
  "build-gop-legacy-display.py",
  "build-munch-touch.py",
  "build-adreno650.py",
]

# edk2-msm firmware. `./unixnu build firmware` expects a Mu-Silicium checkout,
# so the firmware is built by scripts/build-uefi.sh instead; these fields are
# the single source of truth for paths and defines.
[firmware]
config = "munch"
dsc = "Platform/Xiaomi/sm8250/munch.dsc"
fd = "workspace/Build/munch/{target}_CLANG38/FV/SM8250_UEFI.fd"
packages = [
  "{uefi}",
  "{uefi}/Platform/Xiaomi",
  "{uefi}/Common/edk2",
  "{uefi}/Common/edk2-platforms",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
]
patches = []

[firmware.defines]
# edk2-msm build switches, passed through by scripts/build-uefi.sh.
UEFI_FD_BASE = "0xCE000000"
UEFI_FD_SIZE = "0x00700000"
UEFI_BOOTIMG_HEADER_VERSION = "3"
DEVICE_MODEL = "munch"

[bootimg]
# munch stock boot is Android header v3. `fastboot boot` of a header-v1 image
# is rejected by the stock ABL; write to boot_b or use the installer.
image = { header_version = 3, pagesize = 4096, kernel_offset = 0x00000000, ramdisk_offset = 0x00000000, tags_offset = 0x00000000 }

[payload]
# ESP label. The payload is a real FAT32 partition, so this is also the volume
# label the firmware mounts. 176 MiB matches the existing munch port; a real
# ESP only needs the kernel + ADT + trust cache, usually < 128 MiB.
volume = "MUNCHESP"
size_mib = 176
loader = "firmware"
title = "iOS 16.7.16 (munch)"
dram_size = "0x200000000"
# Static + Cryptex1,SystemTrustCache from the iPhone X 16.7.16 IPSW, in the
# UniXNU bundle format. Generated by scripts/extract-ipsw-trust.py.
trust_cache_sha256 = ["eb1475f643f45a974ebd40596f6e2b1cdf40205d2ca3c6094d774886099399c3"]
kernel_args = [
  "debug=0xc",
  "serial=3",
  "cpus=8",
  "keepsyms=1",
  "sheng-lite=1",
  "sheng-disable-watchdogd=1",
  "native-touch=1",
  "sheng-touch-hid=1",
  "offline-mobile-graphics-load=1",
  "offline-legacy-pm=1",
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-logical=1",
  "offline-legacy-phase=4",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "sheng-vsync=60",
  "boot-progress=2",
]

[payload.adt]
# Apple A11 / iPhone X chip id, used by the ADT and the activation identity.
chip_id = "0x8015"
# iPhone X has a 3 GiB DRAM window in this port; the ADT reserves the
# DarwinBoot window inside it.
owned_memory_size = "0xc0000000"
# Supplied per build: --unique-chip-id or UNIXNU_UNIQUE_CHIP_ID.
unique_chip_id = "required"
# Set after the OS volume is created (build/verified-root-os/verification.json).
root_match_volume_uuid = "REQUIRED_OS_VOLUME_UUID"
packed_data_ramdisk = true

# iPhone X identity: the 1080x2400 panel is presented as 1125x2436 at 3x,
# with the gesture-only UI (no Home button).
[adt.root.string]
model = "iPhone10,3"
target-type = "D22"
compatible = "D22AP"

[adt.chosen.string]
osenvironment = "main"
crypto-hash-method = "sha2-384"

[adt.chosen.u32]
display-scale = 3

[adt.product.string]
product-name = "iPhone X"
product-description = "iPhone X"
artwork-device-idiom = "phone"

[adt.product.u32]
artwork-device-subtype = 2436
artwork-scale-factor = 3

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

[device_tree]
source = "device:dts/munch.dts"
include_dirs = ["soc:dts"]

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ios-16.7.16-20H392" = "munch_defconfig"
