name: build-xnu-ios16

# Build xnu-8796 (iOS 16 generation) for the munch port on a macOS runner.
#
# This is the kernel-half build: the UEFI/ESP half is built locally with
# ../../scripts/build-uefi.sh and ../../UniXNU-munch/scripts/build-payload.sh.
#
# The patch set currently comes from ios-sweet (sweet / SM7150). It produces a
# bootable xnu-8796 kernel, but munch's UFS/display/touch/DWC3 addresses are not
# adapted yet: expect it to reach the kernel entry and early console, not a full
# iOS boot. Add munch board patches under xnu/patches-munch and stage them below
# when they exist.

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: "DEVELOPMENT or RELEASE"
        default: DEVELOPMENT
      unique_chip_id:
        description: "64-bit ECID (hex) for the Apple Device Tree"
        default: "0x1234567890abcdef"
      root_volume_uuid:
        description: "OS APFS volume UUID for /chosen/root-matching (optional)"
        default: ""

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  IOS_SWEET_REPO: https://github.com/dipa-studio/ios-sweet
  IOS_SWEET_SHA: 45263bee51df4a0f55cdf9c649af886399488ddb
  MACOS_VERSION: "13.5"

jobs:
  xnu:
    name: xnu-8796 (${{ inputs.kernel_config }})
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch ios-sweet patch set
        run: |
          git init -q ios-sweet
          git -C ios-sweet remote add origin "$IOS_SWEET_REPO"
          git -C ios-sweet fetch -q --depth 1 origin "$IOS_SWEET_SHA"
          git -C ios-sweet checkout -q FETCH_HEAD

      - name: Fetch darwin-xnu-build
        run: |
          git init -q dxb
          git -C dxb remote add origin "$DXB_REPO"
          git -C dxb fetch -q --depth 1 origin "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD

      - name: Stage patches
        run: |
          cp ios-sweet/xnu/patches/*.patch dxb/patches/
          cp ios-sweet/xnu/patches/*.sh dxb/patches/ 2>/dev/null || true
          if [ -d xnu/patches-munch ]; then
            cp xnu/patches-munch/*.patch dxb/patches/ 2>/dev/null || true
          fi
          # libfirehose_kernel is built arm64e-only; this kernel is plain arm64.
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh

      - name: Dependencies
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          # xnu-8796's IORPC ABI needs Xcode 15's iig. macos-15 ships Xcode 15.4
          # alongside 16.x; prefer 15.x when present, otherwise use the newest.
          XC=$(ls -d /Applications/Xcode_15*.app 2>/dev/null | sort -V | head -1 || true)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1); fi
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          KERNEL_CONFIG: ${{ inputs.kernel_config }}
          MACHINE_CONFIG: SWEET
          MAKEFLAGS: -k
        run: bash build.sh

      - name: Collect kernel
        if: always()
        run: |
          mkdir -p out
          # Only the kernel files: no dSYM directories, so the artifact stays
          # small enough to download over a slow link.
          if [ -d dxb/fakeroot/System/Library/Kernels ]; then
            find dxb/fakeroot/System/Library/Kernels -maxdepth 1 -type f -name 'kernel.*' -exec cp {} out/ \;
          fi
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

  adt:
    name: Apple Device Tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate ADT
        env:
          UNIQUE_CHIP_ID: ${{ inputs.unique_chip_id }}
          ROOT_UUID: ${{ inputs.root_volume_uuid }}
        run: |
          extra=()
          if [ -n "$ROOT_UUID" ]; then
            extra=(--root-match-volume-uuid "$ROOT_UUID")
          fi
          python3 scripts/make-munch-adt.py \
            --output out/kernel.macho.adt \
            --dram-size 0x200000000 \
            --owned-memory-size 0xc0000000 \
            --unique-chip-id "$UNIQUE_CHIP_ID" \
            "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: munch-adt
          path: out/kernel.macho.adt
