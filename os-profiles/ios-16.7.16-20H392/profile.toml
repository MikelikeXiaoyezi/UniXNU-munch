# iOS 16.7.16 (20H392) OS profile.
#
# This profile is carried by the device repository because UniXNU upstream
# still only publishes arm64 (iPadOS 17) and arm64e (iPadOS 26/27, macOS 27)
# profiles. Link it into a UniXNU checkout with scripts/install-os-profile.sh.
#
# The kernel for this profile is built from xnu-8796.141.3 with the ios-sweet
# patch set; UniXNU's XnuPrelink path was written for the iPadOS 17/27
# kernelcaches and is NOT used by the iOS 16 build. See docs/PORTING-NOTES.md.

[os]
name = "ios-16.7.16-20H392"
arch = "arm64"
darwin = "22.6.0"
xnu_version = "8796.141.3"
xnu_revision = "f625db25f47631424dc62ac1c3414b6e530f7e8a"
driverkit_tag = "xnu-8796.141.3"
trustcache_tag = "xnu-8796.141.3"
ios_version = "16.7.16"
abi = []

[ipsw]
# iPhone X (iPhone10,3 / d22ap) iOS 16.7.16 restore image.
url = "https://updates.cdn-apple.com/2024FallFCS/fullrestores/062-81498/08F797CE-5201-4475-BC41-5ED2C9A13978/iPhone10,3,iPhone10,6_16.7.16_20H392_Restore.ipsw"
product = "iPhone10,3"
version = "16.7.16"
build = "20H392"
device_class = "d22ap"
chip_id = 0x8015
board_id = 6  # D22AP (iPhone10,3); D221AP is 14
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[kernel]
# xnu-8796.141.3 builds the BCM2837 machine config for this port, same as the
# iOS 16 community ports. The exact build recipe is docs/BUILD.md.

[userdata]
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS", optional = true },
]
